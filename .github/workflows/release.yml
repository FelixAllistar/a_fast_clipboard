name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  windows:
    name: Windows portable build
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tag -ne $cargoVersion) {
            throw "Tag v$tag does not match Cargo.toml version $cargoVersion"
          }

      - name: Build
        run: cargo build --locked --release

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target\release\a_fast_clipboard.exe" "$dist\a_fast_clipboard.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a_fast_clipboard.exe
          path: dist/a_fast_clipboard.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/a_fast_clipboard.exe
          generate_release_notes: true

      - name: sccache stats
        if: always()
        run: sccache --show-stats
