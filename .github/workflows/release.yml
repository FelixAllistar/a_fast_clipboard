name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target\release\a_fast_clipboard.exe" "$dist\a_fast_clipboard-${env:GITHUB_REF_NAME}-windows-x64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a_fast_clipboard-${{ github.ref_name }}-windows-x64.exe
          path: dist/a_fast_clipboard-${{ github.ref_name }}-windows-x64.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/a_fast_clipboard-${{ github.ref_name }}-windows-x64.exe
          generate_release_notes: true
